# Lightweight acceptance workflow: create a Kind cluster, deploy Helm chart (./helm),
# and run integration tests. This validates the Helm chart and provider-neutral behavior in CI.
name: Acceptance — Kind + Helm

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'helm/**'
      - 'k8s/**'
      - '.github/workflows/acceptance-kind-helm.yml'
      - 'tests/integration/**'

jobs:
  kind-helm-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required tools (kubectl, kind, helm)
        run: |
          set -euo pipefail
          echo "Installing kubectl..."
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          echo "Installing kind..."
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          echo "Installing helm..."
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Create kind cluster
        run: |
          kind create cluster --wait 60s

      - name: Build and load Aegis image
        run: |
          docker build -t aegis-api:acceptance .
          kind load docker-image aegis-api:acceptance

      - name: Deploy Aegis API chart
        run: |
          helm upgrade --install aegis-api ./helm/aegis-api \
            --namespace aegis --create-namespace \
            --set image.repository=aegis-api \
            --set image.tag=acceptance \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=1 \
            --set hpa.enabled=false \
            --set-string env[0].name=DATABASE_URL \
            --set-string env[0].value=sqlite:////data/aegis_agent.db \
            --set-string extraEnv[0].name=AEGIS_ALLOW_DEV_PROVIDERS \
            --set-string extraEnv[0].value=true \
            --set-string extraEnv[1].name=AEGIS_LLM_PLANNER_ENABLED \
            --set-string extraEnv[1].value=false \
            --wait --timeout 5m

      - name: Show pod diagnostics on deployment failure
        if: failure()
        run: |
          kubectl -n aegis get pods -o wide || true
          kubectl -n aegis get events --sort-by=.lastTimestamp || true

      - name: Verify the deployed service
        run: |
          kubectl -n aegis rollout status deployment/aegis-api --timeout=180s
          kubectl -n aegis port-forward svc/aegis-api 18080:8080 > /tmp/aegis-port-forward.log 2>&1 &
          echo $! > /tmp/aegis-port-forward.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aegis-port-forward.log
          exit 1

      - name: Run integration tests
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          # Run pytest integration tests if present
          if [ -d tests/integration ]; then
            python -m pip install -r requirements-control-plane.txt pytest requests httpx
            pytest -q tests/integration -k "not long" || (echo "Integration tests failed" && exit 1)
          else
            echo "No integration tests found; skipping."
          fi

      - name: Teardown kind cluster
        if: always()
        run: |
          if [ -f /tmp/aegis-port-forward.pid ]; then
            kill "$(cat /tmp/aegis-port-forward.pid)" || true
          fi
          kind delete cluster || true
