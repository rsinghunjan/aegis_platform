name: AI evaluation gate

# Blocking gate: require the "AI evaluation gate" job in branch protection.
on:
  pull_request:
    paths:
      - ".github/workflows/ai-evaluation.yml"
      - "agentic/planner.py"
      - "agentic/reasoning/prompting.py"
      - "ai_core/**"
      - "aegis_policy/**"
      - "data/golden_datasets/**"
      - "model_registry/**"
      - "models/**"
      - "production.py"
      - "safety_checker.py"
      - "services/**"
      - "scripts/evaluate_*.py"
      - "tests/test_ai_*.py"
      - "tests/test_feedback_loop.py"
      - "tests/test_plan_evaluation.py"
      - "tests/test_policy_and_review.py"
      - "tests/test_real_model_defaults.py"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pip install openai==1.99.9 alembic
      - name: Evaluation, prompt, policy and planner tests
        run: >
          python -m pytest -q
          tests/test_ai_evaluation.py tests/test_ai_core.py
          tests/test_feedback_loop.py tests/test_plan_evaluation.py
          tests/test_regression_sets.py tests/test_real_model_defaults.py
          tests/test_policy_and_review.py tests/test_ai_workflow_api.py

  model-evaluation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fork PRs cannot access secrets, so they cannot run model-backed evals.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pip install openai==1.99.9 alembic
      - name: Require provider credentials
        env:
          AEGIS_LLM_API_KEY: ${{ secrets.AEGIS_LLM_API_KEY }}
        run: |
          if [ -z "$AEGIS_LLM_API_KEY" ]; then
            echo "AEGIS_LLM_API_KEY is required; the evaluation gate fails closed." >&2
            exit 1
          fi
      - name: Golden and regression answer evaluation
        env:
          AEGIS_LLM_API_KEY: ${{ secrets.AEGIS_LLM_API_KEY }}
          AEGIS_EMBEDDING_PROVIDER: openai
        run: python scripts/evaluate_ai_workflow.py --emit-json /tmp/ai-evaluation.json
      - name: Agent plan-quality evaluation
        env:
          AEGIS_LLM_API_KEY: ${{ secrets.AEGIS_LLM_API_KEY }}
        run: python scripts/evaluate_agent_plans.py --emit-json /tmp/plan-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evaluation-reports
          path: /tmp/*-evaluation.json

  gate:
    name: AI evaluation gate
    runs-on: ubuntu-latest
    needs: [unit, model-evaluation]
    if: always()
    steps:
      - name: Require all evaluation jobs to pass
        run: |
          [ "${{ needs.unit.result }}" = "success" ] || exit 1
          # Fail closed: a skipped model evaluation (fork PR) must be re-run from a
          # branch in this repository where secrets are available.
          [ "${{ needs.model-evaluation.result }}" = "success" ] || exit 1
