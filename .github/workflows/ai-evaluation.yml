name: AI evaluation gate

on:
  pull_request:
    paths:
      - ".github/workflows/ai-evaluation.yml"
      - "agentic/reasoning/prompting.py"
      - "data/golden_datasets/**"
      - "production.py"
      - "services/ai_evaluation.py"
      - "services/ai_workflow.py"
      - "services/embeddings/**"
      - "services/inference/**"
      - "scripts/evaluate_ai_workflow.py"
      - "tests/test_ai_evaluation.py"
      - "tests/test_ai_workflow_api.py"
  workflow_dispatch:

jobs:
  golden-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pip install openai==1.99.9
      - name: Run evaluation tests
        run: python -m pytest tests/test_ai_evaluation.py -q
      - name: Run provider-backed golden evaluation
        env:
          AEGIS_LLM_API_KEY: ${{ secrets.AEGIS_LLM_API_KEY }}
        run: python scripts/evaluate_ai_workflow.py --emit-json /tmp/ai-evaluation.json
        if: ${{ env.AEGIS_LLM_API_KEY != '' }}
