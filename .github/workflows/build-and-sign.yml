name: Build & Sign Model Artifact (example)

# This workflow demonstrates how to:
#  - create deterministic archive for a model (uses scripts/make_deterministic_archive.py)
#  - sign the archive with keyless cosign signing via GitHub OIDC
#  - optionally upload the signature and archive to staging object store (AWS S3 example)
#
# Optional secrets:
# - AWS_ROLE_TO_ASSUME (if uploading to S3 via OIDC)
# - AWS_REGION
# - OBJECT_STORE_BUCKET (optional; if uploading)

on:
  workflow_dispatch:
    inputs:
      model_dir:
        description: 'Path to model dir relative to repo (e.g. model_registry/example-tf-model/0.1)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  sign-model:
    runs-on: ubuntu-latest
    env:
      OBJECT_STORE_BUCKET: ${{ secrets.OBJECT_STORE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deterministic archive
        run: |
          MODEL_DIR="${{ github.event.inputs.model_dir }}"
          python3 scripts/make_deterministic_archive.py "${MODEL_DIR}/saved_model" "/tmp/model.tar.gz"
          ls -l /tmp/model.tar.gz
          sha256sum /tmp/model.tar.gz

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign model archive with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --output-signature /tmp/model.tar.gz.sig \
            --output-certificate /tmp/model.tar.gz.pem \
            /tmp/model.tar.gz
          ls -l /tmp/model.tar.gz.sig

      - name: (Optional) Upload archive & signature to S3
        if: ${{ env.OBJECT_STORE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copy archive and signature to S3
        if: ${{ env.OBJECT_STORE_BUCKET != '' }}
        run: |
          aws s3 cp /tmp/model.tar.gz "s3://${OBJECT_STORE_BUCKET}/model-archives/${GITHUB_RUN_ID}/model.tar.gz"
          aws s3 cp /tmp/model.tar.gz.sig "s3://${OBJECT_STORE_BUCKET}/model-archives/${GITHUB_RUN_ID}/model.tar.gz.sig"
          aws s3 cp /tmp/model.tar.gz.pem "s3://${OBJECT_STORE_BUCKET}/model-archives/${GITHUB_RUN_ID}/model.tar.gz.pem"

      - name: Upload signature artifact for PR
        uses: actions/upload-artifact@v4
        with:
          name: model-signature
          path: |
            /tmp/model.tar.gz.sig
            /tmp/model.tar.gz.pem
