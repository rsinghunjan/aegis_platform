name: CI — tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: aegis_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install Python deps
        run: |
          pip install -r api/requirements-dev.txt
          pip install -r requirements.txt
          pip install "openai==1.99.9"
          pip install openai==1.99.9

      - name: Run migrations (create sqlite test DB in repo root)
        run: |
          # For CI we use the sqlite test DB; alembic not required for tests because tests use create_all
          python -c "import os; os.environ['DATABASE_URL']='sqlite:///./test_aegis.db'; print('DB configured for tests')"

      - name: Run safety red-team tests
        run: pytest -q tests/test_safety_redteam.py

      - name: Run tests
        env:
          AEGIS_SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///./test_aegis.db
          AEGIS_TEST_POSTGRES_URL: postgresql+psycopg2://postgres@localhost:5432/aegis_test
        run: |
          python -m pytest -q
