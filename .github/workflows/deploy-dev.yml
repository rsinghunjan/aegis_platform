name: Deploy development environment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aegis-platform:${{ github.sha }}

      - name: Configure cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "Configure KUBECONFIG_B64 in the development environment." >&2
            exit 1
          fi
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy Helm chart
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "Configure DATABASE_URL in the development environment." >&2
            exit 1
          fi
          helm lint helm/aegis-api -f helm/aegis-api/values-dev.yaml
          helm upgrade --install aegis-api helm/aegis-api \
            --namespace aegis --create-namespace \
            -f helm/aegis-api/values-dev.yaml \
            --set-string image.repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/aegis-platform" \
            --set-string image.tag="$GITHUB_SHA" \
            --set-string env[0].name=DATABASE_URL \
            --set-string env[0].value="$DATABASE_URL" \
            --wait --timeout 10m
          kubectl rollout status deployment/aegis-api --namespace aegis --timeout=5m
