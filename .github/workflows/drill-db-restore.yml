name: Database restore smoke test

on:
  workflow_dispatch:
    inputs:
      s3_bucket:
        description: S3 bucket containing the logical backup
        required: true
        type: string
      s3_prefix:
        description: Backup prefix in the bucket
        required: true
        type: string
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ inputs.s3_bucket || secrets.BACKUP_BUCKET }}
      S3_PREFIX: ${{ inputs.s3_prefix || secrets.BACKUP_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install restore dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli docker.io

      - name: Restore and verify latest backup
        run: ./scripts/pg_restore_test.sh "$S3_BUCKET" "$S3_PREFIX"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-diagnostics
          path: /var/log/docker.log
          if-no-files-found: ignore
