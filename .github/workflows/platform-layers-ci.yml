name: platform-layers-ci

# CI/CD for the end-to-end AI platform layers added under services/,
# agentic/reasoning/, frontend/, and ops/production/. Kept separate from
# the legacy workflow sprawl in this repository so it stays fast and
# easy to reason about.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "agentic/reasoning/**"
      - "frontend/**"
      - "ops/production/**"
      - "tests/test_inference_layer.py"
      - "tests/test_embeddings_layer.py"
      - "tests/test_data_layer.py"
      - "tests/test_cloud_layer.py"
      - "tests/test_reasoning_layer.py"
      - "tests/test_observability_layer.py"
      - ".github/workflows/platform-layers-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "agentic/reasoning/**"
      - "frontend/**"
      - "ops/production/**"
      - "tests/test_inference_layer.py"
      - "tests/test_embeddings_layer.py"
      - "tests/test_data_layer.py"
      - "tests/test_cloud_layer.py"
      - "tests/test_reasoning_layer.py"
      - "tests/test_observability_layer.py"
      - ".github/workflows/platform-layers-ci.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-control-plane.txt
          pip install pytest python-multipart httpx duckdb
      - name: Run platform layer tests
        run: |
          python -m pytest \
            tests/test_inference_layer.py \
            tests/test_embeddings_layer.py \
            tests/test_data_layer.py \
            tests/test_cloud_layer.py \
            tests/test_reasoning_layer.py \
            tests/test_observability_layer.py \
            -q

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"
      - name: Lint Helm chart
        run: helm lint ops/production/helm/aegis
      - name: Render Helm templates
        run: helm template aegis ops/production/helm/aegis > /dev/null

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
