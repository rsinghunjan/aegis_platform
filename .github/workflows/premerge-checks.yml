name: Pre-merge checks (scanner + tests)

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'model_registry/**'
jobs:
  premerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt
          pip install -r requirements.txt -r requirements-control-plane.txt
          pip install openai==1.99.9

      - name: Strict SDK scan (fail on direct SDK usage)
        run: |
          git diff --name-only -z "origin/${{ github.base_ref }}...HEAD" -- '*.py' |
            xargs -0 -r python3 scripts/scan_cloud_sdk_usage.py --strict --root . --files

      - name: Run unit tests
        run: |
          pytest -q
