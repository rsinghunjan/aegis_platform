name: Promote model (compatibility wrapper)

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
      model_name:
        required: true
        type: string
      version:
        required: true
        type: string
      tenant_id:
        required: true
        type: string
      approved_manifest_sha256:
        required: true
        type: string
      metric:
        required: false
        default: accuracy
        type: string
      baseline:
        required: false
        default: "0.0"
        type: string
      tolerance:
        required: false
        default: "0.0"
        type: string
      mode:
        required: false
        default: sklearn
        type: string
    secrets:
      AEGIS_OPERATOR_TOKEN:
        required: true
      AEGIS_MODEL_SIGN_PRIVATE_KEY:
        required: true
      AEGIS_MODEL_SIGN_PUBLIC_KEY:
        required: true

jobs:
  promote:
    uses: ./.github/workflows/promote_model_if_valid_signed.yml
    with:
      run_id: ${{ inputs.run_id }}
      artifact_path: ${{ inputs.artifact_path }}
      model_name: ${{ inputs.model_name }}
      version: ${{ inputs.version }}
      tenant_id: ${{ inputs.tenant_id }}
      approved_manifest_sha256: ${{ inputs.approved_manifest_sha256 }}
      metric: ${{ inputs.metric }}
      baseline: ${{ inputs.baseline }}
      tolerance: ${{ inputs.tolerance }}
      mode: ${{ inputs.mode }}
    secrets: inherit
