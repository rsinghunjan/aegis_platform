# Canonical gated, signed model promotion. Retraining outcomes from /agent/runs/{id}/feedback
# are exported as a hash-only manifest; a human approves its SHA-256 via the protected
# "model-promotion" environment (configure required reviewers) before anything is signed.
name: Promote model (validated, signed, human-approved)

on:
  workflow_dispatch:
    inputs:
      run_id: {description: MLflow run id, required: true, type: string}
      artifact_path: {description: Artifact path inside the run, required: true, type: string}
      model_name: {description: Registry model name, required: true, type: string}
      version: {description: Registry version, required: true, type: string}
      tenant_id: {description: Tenant whose feedback produced the retraining set, required: true, type: string}
      approved_manifest_sha256: {description: Reviewed retraining manifest SHA-256, required: true, type: string}
      metric: {description: Validation metric, required: false, default: accuracy, type: string}
      baseline: {description: Baseline metric value, required: false, default: "0.0", type: string}
      tolerance: {description: Allowed regression, required: false, default: "0.0", type: string}
      mode: {description: sklearn or torch, required: false, default: sklearn, type: string}
  workflow_call:
    inputs:
      run_id: {required: true, type: string}
      artifact_path: {required: true, type: string}
      model_name: {required: true, type: string}
      version: {required: true, type: string}
      tenant_id: {required: true, type: string}
      approved_manifest_sha256: {required: true, type: string}
      metric: {required: false, default: accuracy, type: string}
      baseline: {required: false, default: "0.0", type: string}
      tolerance: {required: false, default: "0.0", type: string}
      mode: {required: false, default: sklearn, type: string}
    secrets:
      AEGIS_OPERATOR_TOKEN: {required: true}
      AEGIS_MODEL_SIGN_PRIVATE_KEY: {required: true}
      AEGIS_MODEL_SIGN_PUBLIC_KEY: {required: true}

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: model-promotion
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      AEGIS_OPERATOR_TOKEN: ${{ secrets.AEGIS_OPERATOR_TOKEN }}
      AEGIS_MODEL_SIGN_PRIVATE_KEY: ${{ secrets.AEGIS_MODEL_SIGN_PRIVATE_KEY }}
      AEGIS_MODEL_SIGN_PUBLIC_KEY: ${{ secrets.AEGIS_MODEL_SIGN_PUBLIC_KEY }}
      AEGIS_ALLOW_DEV_PROVIDERS: "true"
      PYTHONPATH: .
      RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_PATH: ${{ inputs.artifact_path }}
      MODEL_NAME: ${{ inputs.model_name }}
      VERSION: ${{ inputs.version }}
      TENANT_ID: ${{ inputs.tenant_id }}
      APPROVED_SHA: ${{ inputs.approved_manifest_sha256 }}
      METRIC: ${{ inputs.metric }}
      BASELINE: ${{ inputs.baseline }}
      TOLERANCE: ${{ inputs.tolerance }}
      MODE: ${{ inputs.mode }}
      AEGIS_BASE_URL: ${{ vars.AEGIS_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-control-plane.txt mlflow scikit-learn joblib boto3 cryptography

      - name: Fetch and verify the approved retraining manifest
        run: |
          set -eu
          python scripts/fetch_retraining_manifest.py \
            --base-url "$AEGIS_BASE_URL" --tenant-id "$TENANT_ID" \
            --out retraining_manifest.json
          python - <<'PY'
          import json, os
          from services.feedback_loop import verify_retraining_manifest
          manifest = json.load(open("retraining_manifest.json"))
          print(verify_retraining_manifest(manifest, os.environ["APPROVED_SHA"]))
          PY

      - name: Validate candidate against baseline
        run: |
          set -eu
          python scripts/evaluate_model.py \
            --mlflow-run-id "$RUN_ID" --mlflow-artifact-path "$ARTIFACT_PATH" \
            --mode "$MODE" --metric "$METRIC" \
            --baseline "$BASELINE" --tolerance "$TOLERANCE" \
            --emit-json validation_result.json
          test "$(jq -r '.status // "error"' validation_result.json)" = "passed"

      - name: Sign, register and record provenance
        run: |
          set -eu
          python scripts/promote_mlflow_run.py \
            --run-id "$RUN_ID" --artifact-path "$ARTIFACT_PATH" \
            --model-name "$MODEL_NAME" --version "$VERSION" \
            --sign-key aegis-model-sign \
            --manifest retraining_manifest.json \
            --approved-manifest-sha256 "$APPROVED_SHA" \
            | tee promote_result.json

      - name: Verify signature before declaring success
        run: |
          set -eu
          ARTIFACT=$(jq -er '.artifact_local_path' promote_result.json)
          SIG=$(jq -er '.signed_paths[0]' promote_result.json)
          python - "$ARTIFACT" "$SIG" <<'PY'
          import sys
          from api.model_signing import verify_model_artifact
          sys.exit(0 if verify_model_artifact(sys.argv[1], sys.argv[2]) else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: promotion-audit
          path: |
            retraining_manifest.json
            validation_result.json
            promote_result.json
