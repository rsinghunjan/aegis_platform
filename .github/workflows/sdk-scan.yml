name: SDK scan — fail PRs with direct provider SDK usage

on:
  pull_request:
    paths:
      - '**/*.py'

jobs:
  sdk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SDK usage scanner
        run: |
          python3 scripts/scan_cloud_sdk_usage.py
