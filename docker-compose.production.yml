services:
  api:
    image: ${AEGIS_IMAGE:?Set AEGIS_IMAGE to the release image}
    env_file:
      - .env.production
    environment:
      AEGIS_ENV: production
      AEGIS_ALLOW_DEV_PROVIDERS: "false"
      AEGIS_AGENT_QUEUE: aegis-agent
      AEGIS_AUTO_MIGRATE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  agent-worker:
    image: ${AEGIS_IMAGE:?Set AEGIS_IMAGE to the release image}
    env_file:
      - .env.production
    environment:
      AEGIS_ENV: production
      AEGIS_ALLOW_DEV_PROVIDERS: "false"
      AEGIS_AGENT_QUEUE: aegis-agent
      AEGIS_AUTO_MIGRATE: "false"
    command:
      - celery
      - -A
      - aegis_workers.agent_worker.celery_app
      - worker
      - --loglevel=INFO
      - --queues=aegis-agent
    # The API image's HTTP healthcheck does not apply to a Celery worker.
    healthcheck:
      disable: true
    restart: unless-stopped
