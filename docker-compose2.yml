version: "3.8"

services:
  # ----------------------------
  # Platform stack (default)
  # ----------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aegis}
      POSTGRES_USER: ${DB_USER:-aegis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aegis} -d ${DB_NAME:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"

  redis:
    image: redis:7
    container_name: aegis_redis
    ports:
      - "6379:6379"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_migrate
    environment:
      # Prefer DATABASE_URL, but split vars also supported.
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aegis}
      DB_USER: ${DB_USER:-aegis}
      DB_PASSWORD: ${DB_PASSWORD:-aegis}
      DB_DRIVER: ${DB_DRIVER:-psycopg}
      AEGIS_EMBEDDING_DIM: ${AEGIS_EMBEDDING_DIM:-1536}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m scripts.db_migrate
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aegis}
      DB_USER: ${DB_USER:-aegis}
      DB_PASSWORD: ${DB_PASSWORD:-aegis}
      DB_DRIVER: ${DB_DRIVER:-psycopg}
      AEGIS_EMBEDDING_DIM: ${AEGIS_EMBEDDING_DIM:-1536}

      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      # default: Redis backend; can be overridden to Postgres:
      # CELERY_RESULT_BACKEND: db+postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}

      # optional auto-migrate:
      AEGIS_AUTO_MIGRATE: ${AEGIS_AUTO_MIGRATE:-false}
    depends_on:
      - redis
      - migrate
    command: python -m aegis_workers.worker
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_control_plane
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aegis}
      DB_USER: ${DB_USER:-aegis}
      DB_PASSWORD: ${DB_PASSWORD:-aegis}
      DB_DRIVER: ${DB_DRIVER:-psycopg}
      AEGIS_EMBEDDING_DIM: ${AEGIS_EMBEDDING_DIM:-1536}

      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}

      AEGIS_AUTO_MIGRATE: ${AEGIS_AUTO_MIGRATE:-false}
    ports:
      - "7000:7000"
    depends_on:
      - redis
      - migrate
    command: python -m aegis_control_plane.main
    restart: "no"

  rag-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_rag_service
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aegis}
      DB_USER: ${DB_USER:-aegis}
      DB_PASSWORD: ${DB_PASSWORD:-aegis}
      DB_DRIVER: ${DB_DRIVER:-psycopg}
      AEGIS_EMBEDDING_DIM: ${AEGIS_EMBEDDING_DIM:-1536}

      AEGIS_AUTO_MIGRATE: ${AEGIS_AUTO_MIGRATE:-false}
    ports:
      - "7001:7001"
    depends_on:
      - migrate
    command: python -m rag_service.main
    restart: "no"

  serving-router:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_serving_router
    environment:
      AEGIS_AUTO_MIGRATE: ${AEGIS_AUTO_MIGRATE:-false}
    ports:
      - "7002:7002"
    command: python -m serving_router.main
    restart: "no"

  # ----------------------------
  # Federated demo (optional)
  # ----------------------------
  federated-server:
    profiles: ["federated"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_federated_server
    command: python -m aegis_multimodal_ai_system.federated.server
    ports:
      - "8080:8080"   # Flower server
      - "8000:8000"   # Prometheus metrics
    restart: "no"

  federated-client-1:
    profiles: ["federated"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_federated_client_1
    command: python -m aegis_multimodal_ai_system.federated.client --cid 1 --host federated-server:8080
    depends_on:
      - federated-server
    restart: "no"

  federated-client-2:
    profiles: ["federated"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/rsinghunjan/aegis_platform/app:dev
    container_name: aegis_federated_client_
