on:
  workflow_dispatch:
jobs:
  cache-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r ops/llm_support/cache/requirements.txt || true
      - name: Run simple key util tests
        run: |
          python3 - <<'PY'
          from ops.llm_support.cache.key_utils import make_cache_key
          k1 = make_cache_key("m","v","sys","hello","", {"temperature":0.0})
          k2 = make_cache_key("m","v","sys","hello","", {"temperature":0.0})
          assert k1==k2
          k3 = make_cache_key("m","v","sys","Hello ","", {"temperature":0.0})
          assert k1==k3
          print("key utils smoke ok")
          PY
      - name: Run local cache smoke
        run: |
          python3 - <<'PY'
          from ops.llm_support.cache.cache import LocalCache
          c = LocalCache(maxsize=10, ttl=2)
          c.set("a", {"response":"x"})
          assert c.get("a")["response"]=="x"
          import time
          time.sleep(3)
          assert c.get("a") is None
          print("local cache ttl smoke ok")
          PY
