{{- if .Values.agentWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-api.fullname" . | default "aegis-api" }}-agent-worker
  labels:
    app: {{ include "aegis-api.name" . | default "aegis-api" }}-agent-worker
spec:
  replicas: {{ .Values.agentWorker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "aegis-api.name" . | default "aegis-api" }}-agent-worker
  template:
    metadata:
      labels:
        app: {{ include "aegis-api.name" . | default "aegis-api" }}-agent-worker
    spec:
      containers:
        - name: agent-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args:
            - "-A"
            - "aegis_workers.agent_worker.celery_app"
            - "worker"
            - "--loglevel=INFO"
            - "--queues={{ .Values.agentWorker.queue }}"
{{- with .Values.envFrom }}
          envFrom:
{{ toYaml . | indent 12 }}
{{- end }}
          env:
            - name: AEGIS_AGENT_QUEUE
              value: "{{ .Values.agentWorker.queue }}"
{{- range concat .Values.env .Values.extraEnv .Values.agentWorker.extraEnv }}
            - name: {{ .name }}
{{- if hasKey . "valueFrom" }}
              valueFrom:
{{ toYaml .valueFrom | indent 16 }}
{{- else }}
              value: "{{ .value }}"
{{- end }}
{{- end }}
          resources:
{{ toYaml .Values.agentWorker.resources | indent 12 }}
{{- end }}
