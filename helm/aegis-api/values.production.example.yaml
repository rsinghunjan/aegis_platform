replicaCount: 2

image:
  repository: your-registry/aegis-api
  tag: replace-with-release-tag
  pullPolicy: IfNotPresent

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: database-url
  - name: AEGIS_AGENT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: database-url
  - name: AEGIS_AI_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: database-url
  - name: AEGIS_MEMORY_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: database-url
  - name: AEGIS_LLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: llm-api-key
  - name: CELERY_BROKER_URL
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: celery-broker-url
  - name: CELERY_RESULT_BACKEND
    valueFrom:
      secretKeyRef:
        name: aegis-runtime
        key: celery-result-backend

extraEnv:
  - name: AEGIS_ENV
    value: production
  - name: AEGIS_ALLOW_DEV_PROVIDERS
    value: "false"
  - name: AEGIS_INFERENCE_PROVIDERS
    value: openai
  - name: AEGIS_EMBEDDING_PROVIDER
    value: openai
  - name: AEGIS_AGENT_ENVIRONMENT
    value: production
  - name: OIDC_ISSUER
    value: https://identity.example.com/
  - name: OIDC_JWKS_URI
    value: https://identity.example.com/.well-known/jwks.json
  - name: OIDC_AUDIENCE
    value: aegis-api
  - name: AEGIS_OIDC_TENANT_CLAIM
    value: tenant_id

agentWorker:
  enabled: true
  replicaCount: 2
  queue: celery
  extraEnv: []
