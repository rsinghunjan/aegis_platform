replicaCount: 3

image:
  repository: ghcr.io/aegis-platform/control-plane
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: aegis.example.com
  tls:
    enabled: true
    secretName: aegis-tls

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

database:
  # Set to an external managed Postgres URL for production; sqlite is
  # only appropriate for local/dev single-replica deployments.
  url: "postgresql://aegis-postgres:5432/aegis"  # credentials injected via secretEnv, not here
  replication:
    enabled: true
    replicas: 2

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

env: []

secretEnv: []
