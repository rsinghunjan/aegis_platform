apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: manual-approval
  namespace: cicd
spec:
  params:
    - name: namespace
      type: string
      default: cicd
    - name: configmap
      type: string
      default: pipeline-approvals
    - name: timeout_seconds
      type: string
      default: "600"
  steps:
    - name: wait-for-approval
      image: bitnami/kubectl:1.27
      script: |
        #!/bin/sh
        set -euo pipefail
        NS=$(params.namespace)
        CM=$(params.configmap)
        TIMEOUT=$(params.timeout_seconds)
        echo "Polling ConfigMap $NS/$CM for 'approved=true' (timeout ${TIMEOUT}s)..."
        i=0
        while [ $i -lt $TIMEOUT ]; do
          val=$(kubectl -n "$NS" get configmap "$CM" -o jsonpath='{.data.approved}' 2>/dev/null || echo "false")
          if [ "$val" = "true" ]; then
            echo "Manual approval observed in ConfigMap $NS/$CM"
            exit 0
          fi
          sleep 5
          i=$((i+5))
        done
        echo "Manual approval timed out after ${TIMEOUT}s"
        exit 1
