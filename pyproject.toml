[project]
name = "aegis-platform"
version = "0.1.0"
description = "AI-first production platform with governed ML and durable agent operations"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==1.10.22",
    "SQLAlchemy==2.0.41",
    "uvicorn==0.34.3",
    "celery[redis]==5.4.0",
    "redis==5.3.1",
    "PyJWT==2.15.1",
    "python-multipart==0.0.30",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
ai = ["openai==1.99.9"]

[tool.aegis.optional-integrations]
gpu = "Install a CUDA/ROCm-matched PyTorch build and model libraries for the target hardware."
tpu = "Install the vendor-supported JAX or TensorFlow TPU packages for the deployment image."
vector = "Install pgvector and configure its PostgreSQL extension only when vector retrieval is enabled."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
exclude = ["docs", "build", ".venv", "venv", "dist"]
extend-ignore = ["E203", "W503"]
